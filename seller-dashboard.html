<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizell — Seller Dashboard</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --red: #ed1717;
            --red-deep: #c00f0f;
            --ink: #111111;
            --white: #ffffff;
            --paper: #f5f4f1;
            --gray: #6b6b6b;
            --green: #17963a;
            --display: 'Space Grotesk', sans-serif;
            --body: 'IBM Plex Sans', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
        body {
            font-family: var(--body);
            background: var(--paper);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }

        /* --- Header --- */
        header {
            background: var(--ink);
            color: var(--white);
            padding: 16px 0;
            border-bottom: 2px solid var(--ink);
        }
        .nav-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-mark img { height: 34px; width: auto; filter: brightness(0) invert(1); }
        .nav-actions { display: flex; gap: 16px; align-items: center; }
        .btn-outline-white {
            background: transparent; color: var(--white);
            border: 2px solid var(--white);
            padding: 8px 16px;
            font-family: var(--display);
            font-weight: 700;
            font-size: 13px;
        }
        .btn-outline-white:hover { background: var(--white); color: var(--ink); }

        /* --- Main Grid --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            padding: 40px 0;
        }
        @media (max-width: 860px) { .dashboard-grid { grid-template-columns: 1fr; } }

        /* --- Cards --- */
        .card {
            background: var(--white);
            border: 2px solid var(--ink);
            padding: 24px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--paper);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .card-header h2 {
            font-family: var(--display);
            font-size: 20px;
            font-weight: 700;
        }
        .btn-primary {
            background: var(--red);
            color: var(--white);
            padding: 10px 18px;
            font-family: var(--display);
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
        }
        .btn-primary:hover { background: var(--red-deep); }
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-green {
            background: var(--green);
            color: var(--white);
            border: none;
            padding: 10px 18px;
            font-weight: 700;
            font-family: var(--display);
            cursor: pointer;
        }

        /* --- Listing Items --- */
        .listing-item {
            border: 1px solid #e4e4e4;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .listing-item .info h4 { font-size: 16px; font-weight: 600; }
        .listing-item .info p { font-size: 13px; color: var(--gray); }
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            text-transform: uppercase;
        }
        .badge.live { background: var(--green); color: var(--white); }
        .badge.pending { background: #ffc107; color: #111; }
        .badge.draft { background: var(--gray); color: var(--white); }
        .badge.rejected { background: var(--red); color: var(--white); }

        /* --- Form --- */
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            font-family: var(--body);
            font-size: 14px;
            background: var(--white);
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }

        /* --- Subscription --- */
        .sub-status { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .sub-status .active { color: var(--green); font-weight: 700; }
        .sub-status .inactive { color: var(--red); font-weight: 700; }
        .msg-box {
            padding: 12px;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        .msg-box.error { display: block; background: #ffe6e6; color: var(--red); border: 1px solid var(--red); }
        .msg-box.success { display: block; background: #e6ffe6; color: var(--green); border: 1px solid var(--green); }

        footer {
            margin-top: auto;
            background: var(--ink);
            color: #999;
            text-align: center;
            padding: 32px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>

<header>
    <div class="wrap nav-row">
        <a href="index.html" class="logo-mark">
            <img src="bizell-logo.jpg" alt="Bizell">
        </a>
        <div class="nav-actions">
            <span id="sellerName" style="font-size:14px; font-weight:600;"></span>
            <button class="btn-outline-white" id="logoutBtn">Logout</button>
        </div>
    </div>
</header>

<main class="wrap dashboard-grid">

    <!-- LEFT COLUMN: My Listings + Subscription -->
    <div>
        <!-- Subscription Card -->
        <div class="card" style="margin-bottom: 24px;">
            <div class="card-header">
                <h2><i class="fa-solid fa-crown" style="color:var(--red);"></i> Subscription</h2>
                <button class="btn-green btn-small" id="subscribeBtn">Upgrade / Pay</button>
            </div>
            <div class="sub-status">
                <span id="subPlan">Loading...</span>
                <span id="subStatus" class="inactive">Inactive</span>
            </div>
            <div style="margin-top:10px; font-size:13px; color:var(--gray);">
                <i class="fa-solid fa-circle-info"></i> You must have an active subscription to keep listings live.
            </div>
        </div>

        <!-- My Listings Card -->
        <div class="card">
            <div class="card-header">
                <h2><i class="fa-solid fa-store"></i> My Listings</h2>
            </div>
            <div id="listingList">
                <div style="text-align:center; padding:20px; color:var(--gray); font-size:14px;">
                    <i class="fa-solid fa-spinner fa-spin"></i> Loading your listings...
                </div>
            </div>
        </div>
    </div>

    <!-- RIGHT COLUMN: New Listing Form -->
    <div class="card">
        <div class="card-header">
            <h2><i class="fa-solid fa-pen-to-square"></i> New Listing</h2>
        </div>
        <form id="newListingForm">
            <div class="form-group">
                <label>Business name *</label>
                <input type="text" id="bizName" required placeholder="e.g. Kampala Electronics">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Price (UGX) *</label>
                    <input type="number" id="bizPrice" required placeholder="5000000">
                </div>
                <div class="form-group">
                    <label>Location *</label>
                    <input type="text" id="bizLocation" required placeholder="Kampala, Uganda">
                </div>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="bizCategory">
                    <option value="retail">Retail</option>
                    <option value="food">Food & Beverage</option>
                    <option value="agriculture">Agriculture</option>
                    <option value="technology">Technology</option>
                    <option value="real estate">Real Estate</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description *</label>
                <textarea id="bizDesc" required placeholder="Describe your business, revenue, staff, equipment..."></textarea>
            </div>
            <div class="form-group">
                <label>Media type</label>
                <select id="mediaType">
                    <option value="images">Images (up to 5)</option>
                    <option value="video">Video (1 file)</option>
                </select>
            </div>
            <div class="form-group" id="imageGroup">
                <label>Upload images (up to 5)</label>
                <input type="file" id="bizImages" accept="image/*" multiple>
                <div id="imgPreview" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"></div>
            </div>
            <div class="form-group hidden" id="videoGroup">
                <label>Upload video</label>
                <input type="file" id="bizVideo" accept="video/*">
            </div>
            <div class="form-group">
                <label>Personal photo (optional)</label>
                <input type="file" id="bizPersonal" accept="image/*">
            </div>
            <div class="form-group">
                <label>Public PDF brochure (optional)</label>
                <input type="file" id="bizPdf" accept=".pdf">
            </div>
            <button type="submit" class="btn-primary" style="width:100%; margin-top:8px;">
                <i class="fa-solid fa-paper-plane"></i> Submit for review
            </button>
            <div class="msg-box" id="formMsg"></div>
        </form>
    </div>

</main>

<footer>
    <div class="wrap">
        &copy; 2026 Bizell. Seller Dashboard.
    </div>
</footer>

<script>
    // --- CONFIG ---
    const AUTH_API = "https://auth-worker-bizell.kakoozaronald71.workers.dev";
    const LISTINGS_API = "https://listings-worker-bizell.kakoozaronald71.workers.dev";
    const PAYMENTS_API = "https://payment-worker-bizell.kakoozaronald71.workers.dev";
    const CLOUD_NAME = "dopuutcka";

    // --- State ---
    let currentUid = localStorage.getItem('bizell_uid');
    let idToken = localStorage.getItem('bizell_idToken');

    if (!idToken || !currentUid) {
        window.location.href = 'auth.html';
    }

    // --- UI refs ---
    const sellerName = document.getElementById('sellerName');
    const logoutBtn = document.getElementById('logoutBtn');
    const listingList = document.getElementById('listingList');
    const subPlan = document.getElementById('subPlan');
    const subStatus = document.getElementById('subStatus');
    const subscribeBtn = document.getElementById('subscribeBtn');
    const formMsg = document.getElementById('formMsg');
    const mediaType = document.getElementById('mediaType');
    const imageGroup = document.getElementById('imageGroup');
    const videoGroup = document.getElementById('videoGroup');
    const bizImages = document.getElementById('bizImages');

    // --- Toggle media upload ---
    mediaType.addEventListener('change', () => {
        if (mediaType.value === 'images') {
            imageGroup.classList.remove('hidden');
            videoGroup.classList.add('hidden');
        } else {
            imageGroup.classList.add('hidden');
            videoGroup.classList.remove('hidden');
        }
    });

    // --- Image preview ---
    bizImages.addEventListener('change', (e) => {
        const preview = document.getElementById('imgPreview');
        preview.innerHTML = '';
        const files = Array.from(e.target.files).slice(0, 5);
        files.forEach(f => {
            const url = URL.createObjectURL(f);
            preview.innerHTML += `<img src="${url}" style="width:60px; height:60px; object-fit:cover; border:1px solid #ccc;">`;
        });
    });

    // --- Load Seller Data ---
    async function loadSellerData() {
        try {
            const resp = await fetch(`${AUTH_API}/me`, {
                headers: { Authorization: `Bearer ${idToken}` }
            });
            if (!resp.ok) throw new Error('Unauthorized');
            const user = await resp.json();
            sellerName.textContent = user.fullName || 'Seller';
            subPlan.textContent = user.subscriptionPlan || 'No plan';
            subStatus.textContent = user.subscriptionActive ? 'Active' : 'Inactive';
            subStatus.className = user.subscriptionActive ? 'active' : 'inactive';
        } catch (e) {
            window.location.href = 'auth.html';
        }
    }

    // --- Load Seller Listings ---
    async function loadListings() {
        try {
            const resp = await fetch(`${LISTINGS_API}/listings/mine`, {
                headers: { Authorization: `Bearer ${idToken}` }
            });
            if (!resp.ok) throw new Error('Failed to load listings');
            const data = await resp.json();

            if (!data.length) {
                listingList.innerHTML = `
                    <div style="text-align:center; padding:20px; color:var(--gray); font-size:14px;">
                        <i class="fa-solid fa-store-slash"></i> You haven't submitted any listings yet.
                    </div>
                `;
                return;
            }

            listingList.innerHTML = data.map(l => {
                const badgeClass = l.status === 'live' ? 'live' : l.status === 'pending_moderation' ? 'pending' : l.status === 'draft' ? 'draft' : 'rejected';
                const badgeLabel = l.status === 'pending_moderation' ? 'Pending' : l.status;
                return `
                    <div class="listing-item">
                        <div class="info">
                            <h4>${l.businessName || 'Untitled'}</h4>
                            <p>${l.location || 'No location'} · ${l.price ? Number(l.price).toLocaleString() + ' UGX' : ''}</p>
                        </div>
                        <div style="display:flex; gap:8px; align-items:center;">
                            <span class="badge ${badgeClass}">${badgeLabel}</span>
                            <button class="btn-primary btn-small" onclick="alert('Edit view coming soon')">Edit</button>
                        </div>
                    </div>
                `;
            }).join('');
        } catch (e) {
            listingList.innerHTML = `<div style="padding:20px; color:var(--red); text-align:center;">Error loading listings.</div>`;
        }
    }

    // --- Submit New Listing ---
    document.getElementById('newListingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        formMsg.className = 'msg-box';
        formMsg.style.display = 'none';

        const name = document.getElementById('bizName').value.trim();
        const price = document.getElementById('bizPrice').value;
        const location = document.getElementById('bizLocation').value.trim();
        const category = document.getElementById('bizCategory').value;
        const desc = document.getElementById('bizDesc').value.trim();
        const type = mediaType.value;

        if (!name || !price || !location || !desc) {
            formMsg.className = 'msg-box error';
            formMsg.textContent = 'Please fill in all required fields.';
            formMsg.style.display = 'block';
            return;
        }

        const btn = document.querySelector('#newListingForm .btn-primary');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';

        // --- Upload files to Cloudinary (mock for now) ---
        // In production, you'd call /upload-signature and upload each file here.
        const mockImages = ['https://via.placeholder.com/600x400?text=Image+1'];

        try {
            const resp = await fetch(`${LISTINGS_API}/listings`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${idToken}`
                },
                body: JSON.stringify({
                    businessName: name,
                    price: Number(price),
                    location,
                    category,
                    description: desc,
                    mediaType: type,
                    images: mockImages,
                    videoUrl: null,
                    status: 'draft' // Starts as draft
                })
            });
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || 'Submission failed');

            formMsg.className = 'msg-box success';
            formMsg.textContent = 'Listing created! You can submit it for review from your list.';
            formMsg.style.display = 'block';
            document.getElementById('newListingForm').reset();
            document.getElementById('imgPreview').innerHTML = '';
            loadListings();
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit for review';
        } catch (err) {
            formMsg.className = 'msg-box error';
            formMsg.textContent = err.message;
            formMsg.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit for review';
        }
    });

    // --- Subscribe button ---
    subscribeBtn.addEventListener('click', async () => {
        const plan = confirm('Click OK for Normal Plan (50k UGX), Cancel for Kakooza Plan (100k UGX)') ? 'normal' : 'kakooza';
        try {
            const resp = await fetch(`${PAYMENTS_API}/create-checkout`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ uid: currentUid, plan })
            });
            const data = await resp.json();
            if (data.checkoutUrl) {
                window.location.href = data.checkoutUrl;
            } else {
                alert('Failed to create payment link.');
            }
        } catch (e) {
            alert('Payment worker unreachable.');
        }
    });

    // --- Logout ---
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('bizell_idToken');
        localStorage.removeItem('bizell_uid');
        localStorage.removeItem('bizell_role');
        window.location.href = 'index.html';
    });

    // --- Init ---
    loadSellerData();
    loadListings();

</script>
</body>
</html>
