 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizell — Reset Password</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --red: #ed1717;
            --ink: #111111;
            --white: #ffffff;
            --paper: #f5f4f1;
            --display: 'Space Grotesk', sans-serif;
            --body: 'IBM Plex Sans', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
        body {
            font-family: var(--body);
            background: var(--paper);
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .reset-wrap {
            background: var(--white);
            border: 2px solid var(--ink);
            max-width: 440px;
            width: 100%;
            padding: 40px 32px;
        }
        .logo-mark {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        .logo-mark img { height: 40px; width: auto; }
        h2 {
            font-family: var(--display);
            font-size: 24px;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            font-family: var(--body);
            font-size: 14px;
            background: var(--white);
        }
        .form-group input:focus { outline: 2px solid var(--red); border-color: transparent; }
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--red);
            color: var(--white);
            font-family: var(--display);
            font-weight: 700;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        .btn-primary:hover { background: #c00f0f; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg-box {
            margin-top: 16px;
            padding: 12px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .msg-box.error { display: block; background: #ffe6e6; color: var(--red); border: 1px solid var(--red); }
        .msg-box.success { display: block; background: #e6ffe6; color: #17963a; border: 1px solid #17963a; }
    </style>
</head>
<body>

<div class="reset-wrap">
    <a href="index.html" class="logo-mark">
        <img src="bizell-logo.jpg" alt="Bizell">
    </a>
    <h2>Set a new password</h2>
    <p style="text-align:center; font-size:14px; color:#6b6b6b; margin-bottom:24px;">
        Enter your new password below.
    </p>

    <form id="resetForm">
        <div class="form-group">
            <label>New password (8+ chars, letters + numbers)</label>
            <input type="password" id="newPassword" required placeholder="••••••••">
        </div>
        <div class="form-group">
            <label>Confirm password</label>
            <input type="password" id="confirmPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary">Reset password</button>
        <div class="msg-box" id="resetMsg"></div>
    </form>
</div>

<script>
    const AUTH_API = "https://auth-worker-bizell.kakoozaronald71.workers.dev";

    // Get the oobCode from the URL (sent by Firebase in the email)
    const urlParams = new URLSearchParams(window.location.search);
    const oobCode = urlParams.get('oobCode');

    // If no oobCode, show error
    if (!oobCode) {
        document.getElementById('resetMsg').className = 'msg-box error';
        document.getElementById('resetMsg').textContent = 'Invalid or expired reset link.';
        document.getElementById('resetMsg').style.display = 'block';
        document.querySelector('.btn-primary').disabled = true;
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const msg = document.getElementById('resetMsg');
        const btn = document.querySelector('.btn-primary');

        if (newPassword.length < 8) {
            msg.className = 'msg-box error';
            msg.textContent = 'Password must be at least 8 characters.';
            msg.style.display = 'block';
            return;
        }

        if (newPassword !== confirmPassword) {
            msg.className = 'msg-box error';
            msg.textContent = 'Passwords do not match.';
            msg.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Resetting...';

        try {
            const resp = await fetch(`${AUTH_API}/reset-password/confirm`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ oobCode, newPassword })
            });

            if (resp.ok) {
                msg.className = 'msg-box success';
                msg.textContent = 'Password reset successfully! Redirecting to login...';
                msg.style.display = 'block';
                setTimeout(() => { window.location.href = 'auth.html'; }, 2000);
            } else {
                const data = await resp.json();
                msg.className = 'msg-box error';
                msg.textContent = data.error || 'Reset failed. Please try again.';
                msg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Reset password';
            }
        } catch (err) {
            msg.className = 'msg-box error';
            msg.textContent = 'Network error. Please try again.';
            msg.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Reset password';
        }
    });
</script>
</body>
</html>
