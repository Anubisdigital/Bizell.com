<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnimeVault - Stream & Catalog</title>
  <style>
    :root {
      --bg-dark: #0f1117;
      --bg-card: #181b23;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #272a37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-box {
      display: flex;
      flex: 1;
      max-width: 400px;
      gap: 0.4rem;
    }

    input[type="text"] {
      width: 100%;
      min-width: 0;
      padding: 0.5rem 0.8rem;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      border-radius: 4px;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    button {
      padding: 0.5rem 1rem;
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border-radius: 4px;
      white-space: nowrap;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    #player-section {
      display: none;
      margin-bottom: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .controls-panel {
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .selectors-group {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .select-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
    }

    select {
      background: var(--bg-dark);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      outline: none;
    }

    .section-title {
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      border-left: 4px solid var(--primary);
      padding-left: 0.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
    }

    @media (min-width: 600px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 1.5rem;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card-info {
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .loader {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a class="logo" onclick="loadTrending()">AnimeVault</a>
      <form class="search-box" id="search-form">
        <input type="text" id="search-input" placeholder="Search anime..." required />
        <button type="submit">Search</button>
      </form>
    </div>
  </header>

  <main>
    <section id="player-section">
      <div class="player-wrapper">
        <iframe id="video-iframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
      <div class="controls-panel">
        <div>
          <h2 id="active-title">Anime Title</h2>
          <p id="active-info" style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.2rem;"></p>
        </div>
        
        <div class="selectors-group">
          <div class="select-item">
            <label for="server-select">Server:</label>
            <select id="server-select" onchange="updatePlayer()">
              <option value="vidsrc">Server 1 (VidSrc)</option>
              <option value="embed2">Server 2 (2Embed)</option>
              <option value="superembed">Server 3 (SuperEmbed)</option>
            </select>
          </div>

          <div class="select-item">
            <label for="episode-select">Episode:</label>
            <select id="episode-select" onchange="updatePlayer()"></select>
          </div>
        </div>
      </div>
    </section>

    <section id="content-section">
      <h2 class="section-title" id="grid-title">Popular Anime</h2>
      <div id="anime-grid" class="grid"></div>
    </section>
  </main>

  <script>
    const ANILIST_URL = 'https://graphql.anilist.co';
    let currentAnime = null;

    const animeGrid = document.getElementById("anime-grid");
    const gridTitle = document.getElementById("grid-title");
    const playerSection = document.getElementById("player-section");
    const videoIframe = document.getElementById("video-iframe");
    const activeTitle = document.getElementById("active-title");
    const activeInfo = document.getElementById("active-info");
    const episodeSelect = document.getElementById("episode-select");
    const serverSelect = document.getElementById("server-select");
    const searchForm = document.getElementById("search-form");
    const searchInput = document.getElementById("search-input");

    document.addEventListener("DOMContentLoaded", () => {
      loadTrending();
    });

    async function fetchAniList(query, variables) {
      const response = await fetch(ANILIST_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json',
        },
        body: JSON.stringify({ query, variables })
      });
      const json = await response.json();
      return json.data.Page.media;
    }

    async function loadTrending() {
      showLoader();
      gridTitle.textContent = "Popular Anime";

      const query = `
        query {
          Page(page: 1, perPage: 24) {
            media(type: ANIME, sort: POPULARITY_DESC) {
              id
              idMal
              title { english romaji }
              coverImage { extraLarge }
              episodes
              averageScore
              format
              status
            }
          }
        }
      `;

      try {
        const data = await fetchAniList(query, {});
        renderGrid(data);
      } catch (err) {
        animeGrid.innerHTML = `<p style="color:red">Failed to load content.</p>`;
      }
    }

    searchForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const searchTerm = searchInput.value.trim();
      if (!searchTerm) return;

      showLoader();
      gridTitle.textContent = `Search Results for "${searchTerm}"`;

      const query = `
        query ($search: String) {
          Page(page: 1, perPage: 24) {
            media(type: ANIME, search: $search) {
              id
              idMal
              title { english romaji }
              coverImage { extraLarge }
              episodes
              averageScore
              format
              status
            }
          }
        }
      `;

      try {
        const data = await fetchAniList(query, { search: searchTerm });
        renderGrid(data);
      } catch (err) {
        animeGrid.innerHTML = `<p style="color:red">Search failed.</p>`;
      }
    });

    function renderGrid(animeList) {
      animeGrid.innerHTML = "";
      if (!animeList || animeList.length === 0) {
        animeGrid.innerHTML = "<p>No anime found.</p>";
        return;
      }

      animeList.forEach(anime => {
        const title = anime.title.english || anime.title.romaji;
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => selectAnime(anime, title);

        card.innerHTML = `
          <img src="${anime.coverImage.extraLarge}" alt="${title}" loading="lazy" />
          <div class="card-info">
            <div class="card-title">${title}</div>
            <div class="card-meta">
              <span>★ ${anime.averageScore ? (anime.averageScore / 10).toFixed(1) : 'N/A'}</span>
              <span>${anime.episodes ? anime.episodes + ' Eps' : 'Ongoing'}</span>
            </div>
          </div>
        `;
        animeGrid.appendChild(card);
      });
    }

    function selectAnime(anime, title) {
      currentAnime = anime;
      const epCount = anime.episodes || 12;

      episodeSelect.innerHTML = "";
      for (let i = 1; i <= epCount; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `Episode ${i}`;
        episodeSelect.appendChild(opt);
      }

      activeTitle.textContent = title;
      activeInfo.textContent = `${anime.format || 'TV'} | Score: ${anime.averageScore ? (anime.averageScore / 10).toFixed(1) : 'N/A'} | Status: ${anime.status}`;
      playerSection.style.display = "block";

      updatePlayer();
      playerSection.scrollIntoView({ behavior: 'smooth' });
    }

    function updatePlayer() {
      if (!currentAnime) return;
      
      const epNumber = episodeSelect.value || 1;
      const server = serverSelect.value;
      const malId = currentAnime.idMal || currentAnime.id;
      const aniId = currentAnime.id;

      let embedUrl = "";

      if (server === "vidsrc") {
        embedUrl = `https://vidsrc.to/embed/anime/${malId}/${epNumber}`;
      } else if (server === "embed2") {
        embedUrl = `https://www.2embed.cc/embedanime/${malId}/${epNumber}`;
      } else if (server === "superembed") {
        embedUrl = `https://multiembed.mov/directstream.php?video_id=${aniId}&is_anime=1&s=1&e=${epNumber}`;
      }

      videoIframe.src = embedUrl;
    }

    function showLoader() {
      animeGrid.innerHTML = `<div class="loader">Fetching anime catalog...</div>`;
    }
  </script>
</body>
</html>
