<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizell — Login / Sign Up</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --red: #ed1717;
            --red-deep: #c00f0f;
            --ink: #111111;
            --white: #ffffff;
            --paper: #f5f4f1;
            --gray: #6b6b6b;
            --display: 'Space Grotesk', sans-serif;
            --body: 'IBM Plex Sans', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }
        body {
            font-family: var(--body);
            background: var(--paper);
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-wrap {
            background: var(--white);
            border: 2px solid var(--ink);
            max-width: 440px;
            width: 100%;
            padding: 40px 32px;
        }
        .logo-mark {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        .logo-mark img {
            height: 40px;
            width: auto;
        }
        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border: 2px solid var(--ink);
            margin-bottom: 28px;
        }
        .tab-btn {
            padding: 14px;
            font-family: var(--display);
            font-weight: 700;
            font-size: 15px;
            background: var(--white);
            border: none;
            cursor: pointer;
            transition: all .15s ease;
        }
        .tab-btn.active {
            background: var(--ink);
            color: var(--white);
        }
        .tab-btn:hover:not(.active) { background: var(--paper); }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            font-family: var(--body);
            font-size: 14px;
            background: var(--white);
        }
        .form-group input:focus { outline: 2px solid var(--red); border-color: transparent; }
        .hidden { display: none !important; }
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--red);
            color: var(--white);
            font-family: var(--display);
            font-weight: 700;
            font-size: 16px;
            border: none;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-primary:hover { background: var(--red-deep); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg-box {
            margin-top: 16px;
            padding: 12px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .msg-box.error { display: block; background: #ffe6e6; color: var(--red); border: 1px solid var(--red); }
        .msg-box.success { display: block; background: #e6ffe6; color: var(--green); border: 1px solid var(--green); }
        .footer-link {
            text-align: center;
            font-size: 14px;
            margin-top: 18px;
            color: var(--gray);
        }
        .footer-link a { color: var(--ink); font-weight: 600; text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-wrap">
    <!-- ACTUAL LOGO IMAGE -->
    <a href="index.html" class="logo-mark">
        <img src="bizell-logo.jpg" alt="Bizell">
    </a>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="login">Log In</button>
        <button class="tab-btn" data-tab="signup">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm">
        <div class="form-group">
            <label>Email address</label>
            <input type="email" id="loginEmail" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary">Log In</button>
        <div class="msg-box" id="loginMsg"></div>
        <div class="footer-link">
            Forgot password? <a href="#" id="resetLink">Reset it</a>
        </div>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="hidden">
        <div class="form-group">
            <label>Full name</label>
            <input type="text" id="signupName" required placeholder="John Doe">
        </div>
        <div class="form-group">
            <label>Email address</label>
            <input type="email" id="signupEmail" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label>Phone number</label>
            <input type="tel" id="signupPhone" required placeholder="+256700000000">
        </div>
        <div class="form-group">
            <label>Password (8+ chars, letters + numbers)</label>
            <input type="password" id="signupPassword" required placeholder="••••••••">
        </div>
        <div class="form-group">
            <label>Account type</label>
            <select id="signupRole">
                <option value="buyer">Buyer (Browse & contact sellers)</option>
                <option value="seller">Seller (List businesses for sale)</option>
            </select>
        </div>
        <div class="form-group hidden" id="businessGroup">
            <label>Business name (required for sellers)</label>
            <input type="text" id="signupBusiness" placeholder="My Business Ltd">
        </div>
        <button type="submit" class="btn-primary">Create Account</button>
        <div class="msg-box" id="signupMsg"></div>
    </form>
</div>

<script>
    // ---------------------------------------------------------------------
    // CONFIG
    // ---------------------------------------------------------------------
    const AUTH_API = "https://auth-worker-bizell.kakoozaronald71.workers.dev";

    // ---------------------------------------------------------------------
    // DOM refs
    // ---------------------------------------------------------------------
    const tabs = document.querySelectorAll('.tab-btn');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const signupRole = document.getElementById('signupRole');
    const businessGroup = document.getElementById('businessGroup');
    const loginMsg = document.getElementById('loginMsg');
    const signupMsg = document.getElementById('signupMsg');

    // ---------------------------------------------------------------------
    // Tab switching
    // ---------------------------------------------------------------------
    tabs.forEach(btn => {
        btn.addEventListener('click', () => {
            tabs.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (btn.dataset.tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginMsg.className = 'msg-box';
                loginMsg.style.display = 'none';
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                signupMsg.className = 'msg-box';
                signupMsg.style.display = 'none';
            }
        });
    });

    // ---------------------------------------------------------------------
    // Toggle business name field
    // ---------------------------------------------------------------------
    signupRole.addEventListener('change', () => {
        if (signupRole.value === 'seller') {
            businessGroup.classList.remove('hidden');
        } else {
            businessGroup.classList.add('hidden');
        }
    });

    // ---------------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------------
    function showMsg(el, type, text) {
        el.className = `msg-box ${type}`;
        el.textContent = text;
        el.style.display = 'block';
    }

    function clearMsg(el) {
        el.className = 'msg-box';
        el.style.display = 'none';
    }

    // ---------------------------------------------------------------------
    // LOGIN
    // ---------------------------------------------------------------------
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMsg(loginMsg);
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btn = loginForm.querySelector('.btn-primary');
        btn.disabled = true;
        btn.textContent = 'Logging in...';

        try {
            const resp = await fetch(`${AUTH_API}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await resp.json();

            if (!resp.ok) {
                if (resp.status === 423) {
                    showMsg(loginMsg, 'error', `Account locked. ${data.error || 'Try again later.'}`);
                } else {
                    showMsg(loginMsg, 'error', data.error || 'Invalid email or password.');
                }
                btn.disabled = false;
                btn.textContent = 'Log In';
                return;
            }

            localStorage.setItem('bizell_idToken', data.idToken);
            localStorage.setItem('bizell_uid', data.uid);
            localStorage.setItem('bizell_role', data.role);
            window.location.href = data.role === 'seller' ? 'seller-dashboard.html' : 'buyer-dashboard.html';
        } catch (err) {
            showMsg(loginMsg, 'error', 'Network error. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Log In';
        }
    });

    // ---------------------------------------------------------------------
    // SIGNUP
    // ---------------------------------------------------------------------
    signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMsg(signupMsg);
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;
        const fullName = document.getElementById('signupName').value.trim();
        const phone = document.getElementById('signupPhone').value.trim();
        const role = signupRole.value;
        const businessName = document.getElementById('signupBusiness').value.trim();
        const btn = signupForm.querySelector('.btn-primary');
        btn.disabled = true;
        btn.textContent = 'Creating account...';

        if (role === 'seller' && !businessName) {
            showMsg(signupMsg, 'error', 'Business name is required for sellers.');
            btn.disabled = false;
            btn.textContent = 'Create Account';
            return;
        }

        try {
            const resp = await fetch(`${AUTH_API}/signup`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, fullName, phone, role, businessName })
            });
            const data = await resp.json();

            if (!resp.ok) {
                showMsg(signupMsg, 'error', data.error || 'Signup failed. Please check your details.');
                btn.disabled = false;
                btn.textContent = 'Create Account';
                return;
            }

            localStorage.setItem('bizell_idToken', data.idToken);
            localStorage.setItem('bizell_uid', data.uid);
            localStorage.setItem('bizell_role', data.role);
            window.location.href = data.role === 'seller' ? 'seller-dashboard.html' : 'buyer-dashboard.html';
        } catch (err) {
            showMsg(signupMsg, 'error', 'Network error. Please try again.');
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    });

    // ---------------------------------------------------------------------
    // PASSWORD RESET (Fully connected to backend)
    // ---------------------------------------------------------------------
    document.getElementById('resetLink').addEventListener('click', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        
        if (!email) {
            alert('Please enter your email address in the Login field first.');
            return;
        }

        try {
            const resp = await fetch(`${AUTH_API}/reset-password/request`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            
            if (resp.ok) {
                alert('If an account exists with that email, a reset link has been sent.');
            } else {
                const data = await resp.json();
                alert(data.error || 'Request failed. Please try again.');
            }
        } catch (err) {
            alert('Network error. Please try again.');
        }
    });
</script>
</body>
</html>
